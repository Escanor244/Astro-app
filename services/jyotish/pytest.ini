[pytest]
testpaths = tests
pythonpath = .
# -ra prints a summary of every skip and xfail. Without it, a whole test module
# vanishing (e.g. a missing optional dependency) shows only as a dot, and the
# suite reports success while covering far less than it appears to.
addopts = -q -ra --strict-markers
markers =
    validation: accuracy gates comparing against the Swiss Ephemeris oracle
